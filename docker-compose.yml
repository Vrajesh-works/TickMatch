services:
  # Builds the image (running every test), generates a synthetic LOBSTER
  # stream, replays it and writes summaries, histograms and a plot to ./out.
  demo:
    build: .
    image: tickmatch:local
    # Run as the host user so files written to ./out are yours.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      MESSAGES: ${MESSAGES:-200000}
    volumes:
      - ./out:/out

  # Microbenchmarks: docker compose run --rm bench
  bench:
    image: tickmatch:local
    build: .
    profiles: ["bench"]
    entrypoint: ["tickmatch_bench"]
